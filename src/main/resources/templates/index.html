<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head th:replace="~{layout/base :: head('Luoghi')}"></head>

<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title mb-0">
            <i class="bi bi-geo-alt me-1"></i>Luoghi
        </h1>
        <a th:href="@{/luoghi/nuovo}" class="btn btn-ca-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Nuovo luogo
        </a>
    </div>

    <div class="row g-3" th:if="${not #lists.isEmpty(luoghi)}">
        <div class="col-12 col-sm-6 col-lg-4" th:each="luogo : ${luoghi}">
            <a th:href="@{/luoghi/{id}(id=${luogo.id})}" class="text-decoration-none">
                <div class="card card-clickable h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-3 d-flex align-items-center justify-content-center flex-shrink-0"
                             style="width:44px;height:44px;background:#e8eef7;">
                            <i class="bi bi-building" style="font-size:1.3rem;color:#214F8D;"></i>
                        </div>
                        <div class="overflow-hidden">
                            <div class="fw-700 text-truncate" style="font-weight:700;color:#214F8D;" th:text="${luogo.nome}">Pescara</div>
                            <div class="small text-muted text-truncate" th:text="${luogo.descrizione != null and !#strings.isEmpty(luogo.descrizione)} ? ${luogo.descrizione} : 'Nessuna descrizione'">
                                Zona e note
                            </div>
                        </div>
                        <i class="bi bi-chevron-right ms-auto text-muted flex-shrink-0"></i>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(luoghi)}" class="text-center py-5">
        <i class="bi bi-geo-alt" style="font-size:2.5rem;color:#d1d5db;"></i>
        <p class="text-muted mt-2 mb-3">Nessun luogo configurato.</p>
        <a th:href="@{/luoghi/nuovo}" class="btn btn-ca-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi il primo luogo
        </a>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
