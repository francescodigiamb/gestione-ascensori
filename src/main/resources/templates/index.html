<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head th:replace="~{layout/base :: head('Dashboard')}"></head>

<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <!-- Stat cards -->
    <div class="row g-2 mb-3">

        <div class="col-4">
            <div class="card text-center p-2">
                <div class="fw-bold" style="font-size:1.6rem;color:#214F8D;" th:text="${impiantiAttivi}">0</div>
                <div class="text-muted" style="font-size:0.72rem;">Impianti attivi</div>
            </div>
        </div>

        <div class="col-4">
            <div class="card text-center p-2">
                <div class="fw-bold" style="font-size:1.6rem;color:#92400e;" th:text="${interventiDaFare}">0</div>
                <div class="text-muted" style="font-size:0.72rem;">Da fare</div>
            </div>
        </div>

        <div class="col-4">
            <div class="card text-center p-2">
                <div class="fw-bold" style="font-size:1.6rem;color:#1e40af;" th:text="${interventiInCorso}">0</div>
                <div class="text-muted" style="font-size:0.72rem;">In corso</div>
            </div>
        </div>

    </div>

    <!-- Sezione in scadenza -->
    <div th:if="${not #lists.isEmpty(inScadenza)}">
        <div class="section-heading d-flex align-items-center gap-2">
            <i class="bi bi-bell-fill text-danger"></i>
            In scadenza / Scaduti
        </div>

        <div class="d-flex flex-column gap-2 mb-3">
            <div th:each="intervento : ${inScadenza}" class="card" style="border-left:4px solid #C73834;">
                <div class="card-body py-2 px-3">

                    <div class="d-flex justify-content-between align-items-start">
                        <div class="overflow-hidden me-2">
                            <!-- Nome impianto cliccabile -->
                            <a th:href="@{/impianti/{id}(id=${intervento.impianto.id})}"
                               class="text-decoration-none fw-bold text-truncate d-block"
                               style="color:#111;"
                               th:text="${intervento.impianto.nome}">ASC-PE-001</a>
                            <div class="small text-muted text-truncate">
                                <i class="bi bi-geo-alt me-1"></i>
                                <span th:text="${intervento.impianto.indirizzo}">Via Roma 10</span>
                            </div>
                        </div>
                        <!-- Badge tipo -->
                        <span class="badge rounded-pill flex-shrink-0"
                              th:classappend="${intervento.tipo.name() == 'GUASTO'} ? 'badge-guasto' : (${intervento.tipo.name() == 'MANUTENZIONE'} ? 'badge-manutenzione' : (${intervento.tipo.name() == 'VERIFICA'} ? 'badge-verifica' : 'badge-altro'))"
                              th:text="${intervento.tipo.label}">Tipo</span>
                    </div>

                    <!-- Descrizione -->
                    <p class="small mb-1 mt-1 text-truncate" th:text="${intervento.descrizione}"></p>

                    <!-- Data programmata con colore rosso se scaduta -->
                    <div class="small"
                         th:classappend="${intervento.dataProgrammata.isBefore(adesso)} ? 'text-danger fw-bold' : 'text-muted'">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span th:text="${intervento.dataProgrammata.isBefore(adesso)} ? 'Scaduto il ' : 'Previsto il '">Previsto il </span>
                        <span th:text="${#temporals.format(intervento.dataProgrammata, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Sezione luoghi -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-heading mb-0">Luoghi</div>
        <a th:href="@{/luoghi/nuovo}" class="btn btn-ca-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Nuovo
        </a>
    </div>

    <div class="row g-2" th:if="${not #lists.isEmpty(luoghi)}">
        <div class="col-12 col-sm-6 col-lg-4" th:each="luogo : ${luoghi}">
            <a th:href="@{/luoghi/{id}(id=${luogo.id})}" class="text-decoration-none">
                <div class="card card-clickable h-100">
                    <div class="card-body d-flex align-items-center gap-3 py-2">
                        <div class="rounded-3 d-flex align-items-center justify-content-center flex-shrink-0"
                             style="width:40px;height:40px;background:#e8eef7;">
                            <i class="bi bi-building" style="font-size:1.2rem;color:#214F8D;"></i>
                        </div>
                        <div class="overflow-hidden">
                            <div class="fw-bold text-truncate" style="color:#214F8D;" th:text="${luogo.nome}">Pescara</div>
                            <div class="small text-muted text-truncate"
                                 th:text="${luogo.descrizione != null and !#strings.isEmpty(luogo.descrizione)} ? ${luogo.descrizione} : 'Nessuna descrizione'"></div>
                        </div>
                        <i class="bi bi-chevron-right ms-auto text-muted flex-shrink-0"></i>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(luoghi)}" class="text-center py-5">
        <i class="bi bi-geo-alt" style="font-size:2.5rem;color:#d1d5db;"></i>
        <p class="text-muted mt-2 mb-3">Nessun luogo configurato.</p>
        <a th:href="@{/luoghi/nuovo}" class="btn btn-ca-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi il primo luogo
        </a>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
