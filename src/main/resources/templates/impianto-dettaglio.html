<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{layout/base :: head(${impianto.nome})}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <a th:href="@{/luoghi/{id}(id=${impianto.luogo.id})}" class="btn btn-link btn-back ps-0 mb-2">
        <i class="bi bi-arrow-left me-1"></i><span th:text="${impianto.luogo.nome}">Pescara</span>
    </a>

    <!-- Header impianto -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h1 class="page-title mb-0" th:text="${impianto.nome}">ASC-PE-001</h1>
                    <div class="small text-muted"
                         th:if="${impianto.matricola != null and !#strings.isEmpty(impianto.matricola)}">
                        <i class="bi bi-upc me-1"></i>Matricola: <span th:text="${impianto.matricola}"></span>
                    </div>
                    <div class="small text-muted mt-1">
                        <i class="bi bi-geo-alt me-1"></i><span th:text="${impianto.indirizzo}">Via Roma 10</span>
                    </div>
                </div>
                <span class="badge rounded-pill"
                      th:classappend="${impianto.stato.name() == 'ATTIVO'} ? 'badge-attivo' : (${impianto.stato.name() == 'SOSPESO'} ? 'badge-sospeso' : 'badge-dismesso')"
                      th:text="${impianto.stato.label}">Attivo</span>
            </div>

            <div th:if="${impianto.note != null and !#strings.isEmpty(impianto.note)}"
                 class="mt-2 small text-muted border-top pt-2">
                <i class="bi bi-sticky me-1"></i><span th:text="${impianto.note}"></span>
            </div>

            <!-- Totale costi + azioni — solo admin -->
            <div th:if="${isAdmin}" class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                <div class="small">
                    <i class="bi bi-currency-euro me-1 text-muted"></i>Totale completati:
                    <strong th:text="${#numbers.formatDecimal(totaleCosti, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</strong>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/impianti/{id}/modifica(id=${impianto.id})}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-pencil me-1"></i>Modifica
                    </a>
                    <form th:action="@{/impianti/{id}/elimina(id=${impianto.id})}" method="post"
                          onsubmit="return confirm('Eliminare l\'impianto e tutti i suoi interventi?')">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Lista interventi -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-heading mb-0">Interventi</div>
        <a th:if="${isAdmin}"
           th:href="@{/impianti/{id}/interventi/nuovo(id=${impianto.id})}" class="btn btn-ca-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi
        </a>
    </div>

    <div class="d-flex flex-column gap-2" th:if="${not #lists.isEmpty(interventi)}">
        <div th:each="intervento : ${interventi}" class="card card-accent-blue">
            <div class="card-body pb-2">

                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <span class="badge rounded-pill me-1"
                              th:classappend="${intervento.tipo.name() == 'GUASTO'} ? 'badge-guasto' : (${intervento.tipo.name() == 'MANUTENZIONE' or intervento.tipo.name() == 'MONTAGGIO'} ? 'badge-manutenzione' : (${intervento.tipo.name() == 'VERIFICA'} ? 'badge-verifica' : 'badge-altro'))"
                              th:text="${intervento.tipo.label}">Tipo</span>
                        <span class="badge rounded-pill"
                              th:classappend="${intervento.stato.name() == 'COMPLETATO'} ? 'badge-completato' : (${intervento.stato.name() == 'DA_FARE'} ? 'badge-da-fare' : (${intervento.stato.name() == 'IN_CORSO'} ? 'badge-in-corso' : 'badge-annullato'))"
                              th:text="${intervento.stato.label}">Stato</span>
                    </div>
                    <span class="small fw-bold text-muted" th:if="${isAdmin and intervento.costo != null}"
                          th:text="${#numbers.formatDecimal(intervento.costo, 1, 'COMMA', 2, 'POINT')} + ' €'"></span>
                </div>

                <!-- Assegnatario — testo per operatore, quick-assign per admin -->
                <div th:if="${not isAdmin and intervento.assegnatario != null}" class="small text-muted mt-1">
                    <i class="bi bi-person me-1"></i>
                    <span th:text="${intervento.assegnatario.nomeCompleto}"></span>
                </div>

                <!-- Quick-assign — solo admin -->
                <div th:if="${isAdmin}" class="mt-2">

                    <!-- GIÀ ASSEGNATO: mostra nome + link "Cambia" collassabile -->
                    <div th:if="${intervento.assegnatario != null}">
                        <div class="d-flex align-items-center gap-2">
                            <span class="small">
                                <i class="bi bi-person-check text-success me-1"></i>
                                <strong th:text="${intervento.assegnatario.nomeCompleto}"></strong>
                            </span>
                            <button type="button"
                                    class="btn btn-link p-0 border-0 text-muted"
                                    style="font-size:0.75rem;"
                                    data-bs-toggle="collapse"
                                    th:data-bs-target="'#assign-' + ${intervento.id}">
                                Cambia
                            </button>
                        </div>
                        <div class="collapse mt-1" th:id="'assign-' + ${intervento.id}">
                            <form th:action="@{/interventi/{id}/assegna(id=${intervento.id})}" method="post">
                                <div class="input-group input-group-sm">
                                    <select class="form-select form-select-sm" name="assegnatarioId" style="font-size:0.8rem;">
                                        <option value="">— Nessuno —</option>
                                        <option th:each="op : ${operatori}"
                                                th:value="${op.id}"
                                                th:text="${op.nomeCompleto}"
                                                th:selected="${intervento.assegnatario.id == op.id}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- NON ASSEGNATO: dropdown sempre visibile -->
                    <div th:if="${intervento.assegnatario == null}">
                        <form th:action="@{/interventi/{id}/assegna(id=${intervento.id})}" method="post">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-white border-end-0 text-warning">
                                    <i class="bi bi-person-dash"></i>
                                </span>
                                <select class="form-select form-select-sm border-start-0"
                                        name="assegnatarioId" style="font-size:0.8rem;">
                                    <option value="">— Non assegnato —</option>
                                    <option th:each="op : ${operatori}"
                                            th:value="${op.id}"
                                            th:text="${op.nomeCompleto}">
                                    </option>
                                </select>
                                <button type="submit" class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </div>
                        </form>
                    </div>

                </div>

                <p class="small mb-1 mt-2" th:text="${intervento.descrizione}"></p>

                <!-- Date e orari -->
                <div class="d-flex flex-wrap gap-3 mt-1">
                    <span class="small text-muted" th:if="${intervento.dataProgrammata != null}">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span th:text="${#temporals.format(intervento.dataProgrammata, 'dd/MM/yyyy')}"></span>
                    </span>
                    <span class="small text-muted" th:if="${intervento.dataEsecuzione != null}">
                        <i class="bi bi-calendar-check me-1"></i>
                        <span th:text="${#temporals.format(intervento.dataEsecuzione, 'dd/MM/yyyy')}"></span>
                    </span>
                    <span class="small text-muted"
                          th:if="${intervento.inizioIntervento != null or intervento.fineIntervento != null}">
                        <i class="bi bi-clock me-1"></i>
                        <span th:if="${intervento.inizioIntervento != null}"
                              th:text="${#temporals.format(intervento.inizioIntervento, 'HH:mm')}"></span>
                        <span th:if="${intervento.inizioIntervento != null and intervento.fineIntervento != null}"> → </span>
                        <span th:if="${intervento.fineIntervento != null}"
                              th:text="${#temporals.format(intervento.fineIntervento, 'HH:mm')}"></span>
                    </span>
                </div>

                <!-- Rapportino -->
                <div th:if="${intervento.noteTecnico != null and !#strings.isEmpty(intervento.noteTecnico)}"
                     class="small text-muted mt-2 p-2 rounded" style="background:#f8f9fa;">
                    <div class="fw-bold mb-1" style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">
                        <i class="bi bi-file-text me-1"></i>Rapportino
                    </div>
                    <span th:text="${intervento.noteTecnico}"></span>
                </div>

                <!-- Azioni -->
                <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top"
                     th:with="isAssegnato=${intervento.assegnatario != null and intervento.assegnatario.username == #authentication.name}">

                    <!-- Cambio stato rapido — admin o operatore assegnato -->
                    <div class="d-flex gap-1 align-items-center" th:if="${isAdmin or isAssegnato}">
                        <!-- DA_FARE: solo "In corso" -->
                        <form th:if="${intervento.stato.name() == 'DA_FARE'}"
                              th:action="@{/interventi/{id}/stato(id=${intervento.id})}" method="post">
                            <input type="hidden" name="stato" value="IN_CORSO">
                            <button type="submit" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-arrow-right-circle me-1"></i>In corso
                            </button>
                        </form>
                        <!-- IN_CORSO: badge -->
                        <span th:if="${intervento.stato.name() == 'IN_CORSO'}"
                              class="badge rounded-pill badge-in-corso">
                            <i class="bi bi-circle-fill me-1" style="font-size:0.5rem;"></i>In corso
                        </span>
                        <!-- COMPLETATO: badge -->
                        <span th:if="${intervento.stato.name() == 'COMPLETATO'}"
                              class="badge rounded-pill badge-completato">
                            <i class="bi bi-check-circle me-1"></i>Completato
                        </span>
                    </div>
                    <div th:if="${not isAdmin and not isAssegnato}"></div>

                    <!-- Apri scheda + elimina -->
                    <div class="d-flex gap-2">
                        <a th:if="${isAdmin or isAssegnato}"
                           th:href="@{/interventi/{id}/modifica(id=${intervento.id})}"
                           class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-file-text me-1"></i>Scheda
                        </a>
                        <form th:if="${isAdmin}"
                              th:action="@{/interventi/{id}/elimina(id=${intervento.id})}" method="post"
                              onsubmit="return confirm('Eliminare questo intervento?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(interventi)}" class="text-center py-5">
        <i class="bi bi-tools" style="font-size:2.5rem;color:#d1d5db;"></i>
        <p class="text-muted mt-2 mb-3">Nessun intervento registrato.</p>
        <a th:if="${isAdmin}"
           th:href="@{/impianti/{id}/interventi/nuovo(id=${impianto.id})}" class="btn btn-ca-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi il primo intervento
        </a>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
