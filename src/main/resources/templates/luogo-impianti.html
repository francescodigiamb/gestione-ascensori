<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head th:replace="~{layout/base :: head(${luogo.nome})}"></head>

<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <!-- Back -->
    <a th:href="@{/}" class="btn btn-link btn-back ps-0 mb-2">
        <i class="bi bi-arrow-left me-1"></i>Tutti i luoghi
    </a>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h1 class="page-title mb-0" th:text="${luogo.nome}">Pescara</h1>
            <p class="small text-muted mb-0"
               th:text="${luogo.descrizione != null and !#strings.isEmpty(luogo.descrizione)} ? ${luogo.descrizione} : ''"
               th:if="${luogo.descrizione != null and !#strings.isEmpty(luogo.descrizione)}"></p>
        </div>
        <a th:href="@{/luoghi/{id}/impianti/nuovo(id=${luogo.id})}" class="btn btn-ca-primary btn-sm flex-shrink-0">
            <i class="bi bi-plus-lg me-1"></i>Nuovo impianto
        </a>
    </div>

    <!-- Ricerca -->
    <form class="mb-3" method="get" th:action="@{/luoghi/{id}(id=${luogo.id})}">
        <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" class="form-control border-start-0 ps-0" name="q"
                   placeholder="Cerca per nome o indirizzo…" th:value="${query}">
            <button class="btn btn-outline-secondary" type="submit">Cerca</button>
            <a th:if="${query != null and !#strings.isEmpty(query)}"
               th:href="@{/luoghi/{id}(id=${luogo.id})}"
               class="btn btn-outline-secondary">
                <i class="bi bi-x"></i>
            </a>
        </div>
        <p class="small text-muted mt-1 mb-0" th:if="${query != null and !#strings.isEmpty(query)}">
            Risultati per: "<span th:text="${query}"></span>"
        </p>
    </form>

    <!-- Lista impianti -->
    <div class="d-flex flex-column gap-2" th:if="${not #lists.isEmpty(impiantiRiepilogo)}">
        <div th:each="item : ${impiantiRiepilogo}">
            <div class="card card-accent-red">
                <div class="card-body pb-2">
                    <a th:href="@{/impianti/{id}(id=${item.impianto.id})}" class="text-decoration-none">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="overflow-hidden me-2">
                                <div class="fw-bold text-truncate" style="color:#111;" th:text="${item.impianto.nome}">ASC-PE-001</div>
                                <div class="small text-muted text-truncate">
                                    <i class="bi bi-geo-alt me-1"></i>
                                    <span th:text="${item.impianto.indirizzo}">Via Roma 10</span>
                                </div>
                            </div>
                            <!-- Badge stato impianto -->
                            <span class="badge rounded-pill flex-shrink-0"
                                  th:classappend="${item.impianto.stato.name() == 'ATTIVO'} ? 'badge-attivo' : (${item.impianto.stato.name() == 'SOSPESO'} ? 'badge-sospeso' : 'badge-dismesso')"
                                  th:text="${item.impianto.stato.label}">Attivo</span>
                        </div>

                        <!-- Riepilogo interventi -->
                        <div class="d-flex gap-3 mt-2">
                            <span class="small">
                                <i class="bi bi-check-circle text-success me-1"></i>
                                <span th:text="${item.interventiCompletati}">0</span> completati
                            </span>
                            <span class="small">
                                <i class="bi bi-clock text-warning me-1"></i>
                                <span th:text="${item.interventiDaFare}">0</span> da fare
                            </span>
                        </div>
                    </a>

                    <!-- Azioni -->
                    <div class="d-flex justify-content-end gap-2 mt-2 pt-2 border-top">
                        <a th:href="@{/impianti/{id}/modifica(id=${item.impianto.id})}"
                           class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-pencil me-1"></i>Modifica
                        </a>
                        <!-- Delete impianto -->
                        <form th:action="@{/impianti/{id}/elimina(id=${item.impianto.id})}" method="post"
                              onsubmit="return confirm('Eliminare l\'impianto e tutti i suoi interventi?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(impiantiRiepilogo)}" class="text-center py-5">
        <i class="bi bi-elevator" style="font-size:2.5rem;color:#d1d5db;"></i>
        <p class="text-muted mt-2 mb-3"
           th:text="${query != null and !#strings.isEmpty(query)} ? 'Nessun impianto trovato per &quot;' + ${query} + '&quot;.' : 'Nessun impianto registrato per questo luogo.'">
            Nessun impianto.
        </p>
        <a th:if="${query == null or #strings.isEmpty(query)}"
           th:href="@{/luoghi/{id}/impianti/nuovo(id=${luogo.id})}"
           class="btn btn-ca-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi il primo impianto
        </a>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
