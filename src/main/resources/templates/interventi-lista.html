<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{layout/base :: head('Interventi')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <a th:href="@{/}" class="btn btn-link btn-back ps-0 mb-2">
        <i class="bi bi-arrow-left me-1"></i>Dashboard
    </a>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title mb-0">
            <i class="bi bi-tools me-1"></i>Interventi
            <span th:if="${statoFiltro != null}"
                  class="badge rounded-pill ms-2"
                  th:classappend="${statoFiltro.name() == 'COMPLETATO'} ? 'badge-completato' : (${statoFiltro.name() == 'DA_FARE'} ? 'badge-da-fare' : (${statoFiltro.name() == 'IN_CORSO'} ? 'badge-in-corso' : 'badge-annullato'))"
                  th:text="${statoFiltro.label}"></span>
        </h1>
        <!-- Filtri rapidi -->
        <div class="d-flex gap-1 flex-wrap justify-content-end">
            <a th:href="@{/interventi}" class="btn btn-sm"
               th:classappend="${statoFiltro == null} ? 'btn-ca-secondary' : 'btn-outline-secondary'">Tutti</a>
            <a th:each="s : ${statiIntervento}" th:href="@{/interventi(stato=${s.name()})}"
               class="btn btn-sm"
               th:classappend="${statoFiltro == s} ? 'btn-ca-secondary' : 'btn-outline-secondary'"
               th:text="${s.label}">Stato</a>
        </div>
    </div>

    <div class="d-flex flex-column gap-2" th:if="${not #lists.isEmpty(interventi)}">
        <div th:each="intervento : ${interventi}" class="card card-accent-blue">
            <div class="card-body py-2 px-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="overflow-hidden me-2">
                        <a th:href="@{/impianti/{id}(id=${intervento.impianto.id})}"
                           class="text-decoration-none fw-bold text-truncate d-block"
                           style="color:#111;" th:text="${intervento.impianto.nome}">ASC-PE-001</a>
                        <div class="small text-muted text-truncate">
                            <i class="bi bi-geo-alt me-1"></i>
                            <span th:text="${intervento.impianto.indirizzo}">Via Roma 10</span>
                        </div>
                    </div>
                    <div class="d-flex flex-column align-items-end gap-1 flex-shrink-0">
                        <span class="badge rounded-pill"
                              th:classappend="${intervento.stato.name() == 'COMPLETATO'} ? 'badge-completato' : (${intervento.stato.name() == 'DA_FARE'} ? 'badge-da-fare' : (${intervento.stato.name() == 'IN_CORSO'} ? 'badge-in-corso' : 'badge-annullato'))"
                              th:text="${intervento.stato.label}">Stato</span>
                        <span class="badge rounded-pill"
                              th:classappend="${intervento.tipo.name() == 'GUASTO'} ? 'badge-guasto' : (${intervento.tipo.name() == 'MANUTENZIONE'} ? 'badge-manutenzione' : (${intervento.tipo.name() == 'VERIFICA'} ? 'badge-verifica' : (${intervento.tipo.name() == 'MONTAGGIO'} ? 'badge-manutenzione' : 'badge-altro')))"
                              th:text="${intervento.tipo.label}">Tipo</span>
                    </div>
                </div>

                <p class="small mb-1 mt-1 text-truncate" th:text="${intervento.descrizione}"></p>

                <div class="d-flex flex-wrap gap-3">
                    <span class="small text-muted" th:if="${intervento.dataProgrammata != null}">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span th:text="${#temporals.format(intervento.dataProgrammata, 'dd/MM/yyyy')}"></span>
                    </span>
                    <span class="small text-muted"
                          th:if="${intervento.inizioIntervento != null or intervento.fineIntervento != null}">
                        <i class="bi bi-clock me-1"></i>
                        <span th:if="${intervento.inizioIntervento != null}"
                              th:text="${#temporals.format(intervento.inizioIntervento, 'HH:mm')}"></span>
                        <span th:if="${intervento.fineIntervento != null}"
                              th:text="' → ' + ${#temporals.format(intervento.fineIntervento, 'HH:mm')}"></span>
                    </span>
                    <span class="small fw-bold text-muted" th:if="${intervento.costo != null}"
                          th:text="${#numbers.formatDecimal(intervento.costo, 1, 'COMMA', 2, 'POINT')} + ' €'"></span>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-2">
                    <a th:if="${isAdmin and intervento.noteTecnico != null and !#strings.isEmpty(intervento.noteTecnico)}"
                       th:href="@{/interventi/{id}/rapportino.docx(id=${intervento.id})}"
                       class="btn btn-word btn-sm" title="Scarica il rapportino in Word">
                        <i class="bi bi-file-earmark-word me-1"></i>Word
                    </a>
                    <a th:href="@{/interventi/{id}/modifica(id=${intervento.id})}"
                       class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-pencil me-1"></i>Apri scheda
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(interventi)}" class="text-center py-5">
        <i class="bi bi-tools" style="font-size:2.5rem;color:#d1d5db;"></i>
        <p class="text-muted mt-2">Nessun intervento trovato.</p>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
