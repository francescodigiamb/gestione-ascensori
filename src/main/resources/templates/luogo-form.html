<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head th:replace="~{layout/base :: head('Nuovo luogo')}"></head>

<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <!-- Back -->
    <a th:href="@{/}" class="btn btn-link btn-back ps-0 mb-2">
        <i class="bi bi-arrow-left me-1"></i>Tutti i luoghi
    </a>

    <h1 class="page-title mb-3">Nuovo luogo</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/luoghi/nuovo}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nome luogo</label>
                    <input type="text" class="form-control" name="nome" required
                           placeholder="es. Pescara"
                           th:value="${luogo != null} ? ${luogo.nome} : ''">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrizione <span class="text-muted fw-normal">(facoltativa)</span></label>
                    <textarea class="form-control" name="descrizione" rows="2"
                              placeholder="Zone, note, riferimenti…"
                              th:text="${luogo != null} ? ${luogo.descrizione} : ''"></textarea>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/}" class="btn btn-outline-secondary">
                        Annulla
                    </a>
                    <button type="submit" class="btn btn-ca-primary">
                        <i class="bi bi-floppy me-1"></i>Crea luogo
                    </button>
                </div>

            </form>
        </div>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
