<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head th:replace="~{layout/base :: head(${mode == 'edit'} ? 'Modifica intervento' : 'Nuovo intervento')}"></head>

<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <!-- Back -->
    <a th:href="@{/impianti/{id}(id=${impianto.id})}" class="btn btn-link btn-back ps-0 mb-2">
        <i class="bi bi-arrow-left me-1"></i><span th:text="${impianto.nome}">ASC-PE-001</span>
    </a>

    <h1 class="page-title mb-1"
        th:text="${mode == 'edit'} ? 'Modifica intervento' : 'Nuovo intervento'">
        Nuovo intervento
    </h1>
    <p class="small text-muted mb-3">
        <i class="bi bi-geo-alt me-1"></i><span th:text="${impianto.indirizzo}">Via Roma 10</span>
    </p>

    <div class="card">
        <div class="card-body">
            <form th:action="${formAction}" method="post">

                <div class="row g-3">

                    <div class="col-12 col-sm-6">
                        <label class="form-label">Tipo intervento</label>
                        <select class="form-select" name="tipo" required>
                            <option th:each="t : ${tipiIntervento}"
                                    th:value="${t}"
                                    th:text="${t.label}"
                                    th:selected="${mode == 'edit' and intervento != null} ? ${intervento.tipo} == ${t} : false">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label class="form-label">Stato</label>
                        <select class="form-select" name="stato" required>
                            <option th:each="s : ${statiIntervento}"
                                    th:value="${s}"
                                    th:text="${s.label}"
                                    th:selected="${mode == 'edit' and intervento != null} ? ${intervento.stato} == ${s} : (${s.name() == 'DA_FARE'})">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label class="form-label">Data programmata <span class="text-muted fw-normal">(facoltativa)</span></label>
                        <input type="datetime-local" class="form-control" name="dataProgrammata"
                               th:value="${dataProgrammataFormatted} ?: ''">
                    </div>

                    <div class="col-12 col-sm-6">
                        <label class="form-label">Data esecuzione <span class="text-muted fw-normal">(facoltativa)</span></label>
                        <input type="datetime-local" class="form-control" name="dataEsecuzione"
                               th:value="${dataEsecuzioneFormatted} ?: ''">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Descrizione</label>
                        <textarea class="form-control" name="descrizione" rows="3" required
                                  placeholder="Descrivi l'intervento da svolgere o svolto…"
                                  th:text="${mode == 'edit' and intervento != null} ? ${intervento.descrizione} : ''"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Note tecnico <span class="text-muted fw-normal">(facoltative)</span></label>
                        <textarea class="form-control" name="noteTecnico" rows="2"
                                  placeholder="Annotazioni del tecnico a fine lavoro…"
                                  th:text="${mode == 'edit' and intervento != null} ? ${intervento.noteTecnico} : ''"></textarea>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label class="form-label">Costo (€) <span class="text-muted fw-normal">(facoltativo)</span></label>
                        <div class="input-group">
                            <span class="input-group-text">€</span>
                            <input type="number" step="0.01" min="0" class="form-control" name="costo"
                                   placeholder="0,00"
                                   th:value="${mode == 'edit' and intervento != null and intervento.costo != null} ? ${intervento.costo} : ''">
                        </div>
                    </div>

                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/impianti/{id}(id=${impianto.id})}" class="btn btn-outline-secondary">
                        Annulla
                    </a>
                    <button type="submit" class="btn btn-ca-primary">
                        <i class="bi bi-floppy me-1"></i>
                        <span th:text="${mode == 'edit'} ? 'Salva modifiche' : 'Crea intervento'">Salva</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
