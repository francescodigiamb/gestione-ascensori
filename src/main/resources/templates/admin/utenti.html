<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{layout/base :: head('Gestione utenti')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-3">

    <a th:href="@{/}" class="btn btn-link btn-back ps-0 mb-2">
        <i class="bi bi-arrow-left me-1"></i>Dashboard
    </a>

    <h1 class="page-title mb-1"><i class="bi bi-people me-1"></i>Gestione utenti</h1>
    <p class="small text-muted mb-3">Visualizza e gestisci gli account dell'app.</p>

    <!-- Flash message -->
    <div th:if="${msg}" class="alert alert-success rounded-3 py-2 small mb-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${msg}"></span>
    </div>

    <div class="d-flex flex-column gap-3">
        <div th:each="utente : ${utenti}" class="card">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="fw-bold" th:text="${utente.nomeCompleto}">Nome Cognome</div>
                        <div class="small text-muted">
                            <i class="bi bi-person me-1"></i>
                            <span th:text="${utente.username}">username</span>
                        </div>
                    </div>
                    <span class="badge rounded-pill"
                          th:classappend="${utente.ruolo.name() == 'ADMIN'} ? 'badge-in-corso' : 'badge-attivo'"
                          th:text="${utente.ruolo.name() == 'ADMIN'} ? 'Admin' : 'Operatore'">Ruolo</span>
                </div>

                <!-- Form modifica nome -->
                <form th:action="@{/admin/utenti/{id}/nome(id=${utente.id})}" method="post"
                      class="mt-3 border-top pt-3">
                    <div class="row g-2 align-items-end">
                        <div class="col">
                            <label class="form-label">Nome completo</label>
                            <input type="text" class="form-control form-control-sm" name="nomeCompleto"
                                   th:value="${utente.nomeCompleto}" required>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-floppy"></i>
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Form reset password -->
                <form th:action="@{/admin/utenti/{id}/password(id=${utente.id})}" method="post"
                      class="mt-2">
                    <div class="row g-2 align-items-end">
                        <div class="col">
                            <label class="form-label">Nuova password</label>
                            <input type="password" class="form-control form-control-sm"
                                   name="nuovaPassword" placeholder="Nuova password" required minlength="6">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-outline-warning btn-sm"
                                    onclick="return confirm('Cambiare la password?')">
                                <i class="bi bi-key"></i>
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

</main>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
