<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="it">

<!-- ========================
     FRAGMENT: head
     Uso: th:replace="~{layout/base :: head('Titolo pagina')}"
     ======================== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title} + ' — Chiavaroli Ascensori'">Chiavaroli Ascensori</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --ca-blue: #214F8D;
            --ca-red: #C73834;
            --ca-blue-dark: #1a3f71;
            --ca-red-dark: #a02e2a;
        }

        body {
            background-color: #f4f6f9;
            font-size: 0.925rem;
        }

        /* Navbar */
        .navbar-ca { background-color: var(--ca-blue); }
        .navbar-ca .navbar-brand { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.85rem; }
        .navbar-ca .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .navbar-ca .nav-link:hover, .navbar-ca .nav-link.active { color: #fff !important; }
        .navbar-ca .nav-link-logout { color: rgba(255,255,255,0.7) !important; font-size: 0.85rem; }
        .navbar-ca .nav-link-logout:hover { color: #fff !important; }

        /* Cards */
        .card { border: none; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: box-shadow 0.15s ease, transform 0.1s ease; }
        .card-clickable:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.13); transform: translateY(-2px); }
        .card-clickable:active { transform: translateY(0); }

        /* Buttons */
        .btn-ca-primary { background-color: var(--ca-red); color: #fff; border: none; font-weight: 600; }
        .btn-ca-primary:hover { background-color: var(--ca-red-dark); color: #fff; }
        .btn-ca-secondary { background-color: var(--ca-blue); color: #fff; border: none; font-weight: 600; }
        .btn-ca-secondary:hover { background-color: var(--ca-blue-dark); color: #fff; }

        /* Page title */
        .page-title { color: var(--ca-blue); font-weight: 700; font-size: 1.15rem; }

        /* Status badges */
        .badge-attivo    { background-color: #d1fae5; color: #065f46; }
        .badge-sospeso   { background-color: #fef3c7; color: #92400e; }
        .badge-dismesso  { background-color: #f3f4f6; color: #6b7280; }
        .badge-da-fare   { background-color: #fef3c7; color: #92400e; }
        .badge-in-corso  { background-color: #dbeafe; color: #1e40af; }
        .badge-completato { background-color: #d1fae5; color: #065f46; }
        .badge-annullato { background-color: #f3f4f6; color: #6b7280; }
        .badge-guasto    { background-color: #fee2e2; color: #991b1b; }
        .badge-manutenzione { background-color: #dbeafe; color: #1e40af; }
        .badge-verifica  { background-color: #ede9fe; color: #5b21b6; }
        .badge-altro     { background-color: #f3f4f6; color: #6b7280; }

        /* Sidebar-left accent on cards */
        .card-accent-red  { border-left: 4px solid var(--ca-red) !important; }
        .card-accent-blue { border-left: 4px solid var(--ca-blue) !important; }

        /* Bottom nav spacing on mobile */
        main { padding-bottom: 5rem; }

        /* Form */
        .form-label { font-weight: 600; font-size: 0.8rem; color: #374151; text-transform: uppercase; letter-spacing: 0.03em; }
        .form-control, .form-select { border-radius: 8px; border-color: #d1d5db; font-size: 0.9rem; }
        .form-control:focus, .form-select:focus { border-color: var(--ca-blue); box-shadow: 0 0 0 3px rgba(33,79,141,0.12); }

        /* Back link */
        .btn-back { color: var(--ca-blue); font-weight: 600; font-size: 0.85rem; padding-left: 0; }
        .btn-back:hover { color: var(--ca-blue-dark); }

        /* Section heading */
        .section-heading { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 0.5rem; margin-top: 1.25rem; }
    </style>
</head>

<!-- ========================
     FRAGMENT: navbar
     Uso: th:replace="~{layout/base :: navbar}"
     ======================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-ca navbar-dark sticky-top">
    <div class="container-fluid px-3">

        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <img th:src="@{/img/logo-chiavaroli-ascensori.png}" alt="Chiavaroli Ascensori" style="height:30px;">
            <span class="d-none d-sm-inline">Gestione Impianti</span>
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-house me-1"></i>Home
                        <!-- Badge alert interventi in scadenza -->
                        <span th:if="${navbarAlertCount != null and navbarAlertCount > 0 and isHomePage != true}"
                              class="badge rounded-pill bg-danger ms-1"
                              style="font-size:0.7rem;"
                              th:text="${navbarAlertCount}">0</span>
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50 small d-none d-md-inline">
                    <i class="bi bi-person-circle me-1"></i>Admin
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-link nav-link-logout p-0 border-0 bg-transparent">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        <span class="small">Esci</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- ========================
     FRAGMENT: scripts
     Uso: th:replace="~{layout/base :: scripts}"
     ======================== -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
