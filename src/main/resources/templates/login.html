<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accesso — Chiavaroli Ascensori</title>
    <link rel="icon" type="image/png" th:href="@{/img/icona-home.png}">
    <link rel="apple-touch-icon" th:href="@{/img/icona-home.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a3f71 0%, #214F8D 60%, #2d6bc4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
        }
        .login-logo { height: 52px; }
        .login-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9ca3af;
            margin-top: 0.25rem;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .form-control {
            border-radius: 10px;
            border-color: #e5e7eb;
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #214F8D;
            box-shadow: 0 0 0 3px rgba(33,79,141,0.12);
        }
        .input-group-text {
            background: #f9fafb;
            border-color: #e5e7eb;
            border-radius: 10px 0 0 10px;
            color: #9ca3af;
        }
        .input-group .form-control { border-radius: 0 10px 10px 0; }
        .btn-login {
            background: #C73834;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            width: 100%;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #a02e2a; color: #fff; }
        .alert-error {
            background: #fee2e2;
            border: none;
            border-radius: 10px;
            color: #991b1b;
            font-size: 0.88rem;
            padding: 0.65rem 1rem;
        }
        .alert-logout {
            background: #d1fae5;
            border: none;
            border-radius: 10px;
            color: #065f46;
            font-size: 0.88rem;
            padding: 0.65rem 1rem;
        }
        .footer-text { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-align: center; margin-top: 1.5rem; }
    </style>
</head>
<body>

    <div>
        <div class="login-card">
            <!-- Logo e titolo -->
            <div class="text-center mb-4">
                <img th:src="@{/img/logo-chiavaroli-ascensori.png}" alt="Chiavaroli Ascensori" class="login-logo mb-2">
                <div class="login-title">Gestione Impianti</div>
            </div>

            <!-- Alert errore login -->
            <div th:if="${param.error}" class="alert-error mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>
                Credenziali non corrette. Riprova.
            </div>

            <!-- Alert logout -->
            <div th:if="${param.logout}" class="alert-logout mb-3">
                <i class="bi bi-check-circle me-1"></i>
                Disconnessione avvenuta con successo.
            </div>

            <!-- Form login -->
            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Utente</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" name="username"
                               class="form-control" placeholder="Nome utente"
                               autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password"
                               class="form-control" placeholder="Password"
                               autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
                </button>

            </form>
        </div>

        <div class="footer-text">© Chiavaroli Ascensori</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
